set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*:Tc"

set -sg escape-time 10

set -g history-limit 100000

unbind C-b
set -g prefix C-a
bind C-a send-prefix
setw -g xterm-keys on
setw -g mode-keys vi

bind u run ~/dotfiles/scripts/tmux-url-select

# -- display -------------------------------------------------------------------

set -g base-index 1         # start windows numbering at 1
setw -g pane-base-index 1   # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
set -g renumber-windows on  # renumber windows when a window is closed

set -g set-titles on                        # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g focus-events on

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 2

# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -as terminal-features ",xterm-256color:RGB"
# ghostty
set -as terminal-features ",ghostty:RGB"

# for claude code
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set-option -g mouse on

set -s set-clipboard on
if-shell "uname | grep -q Darwin" \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/bin/tmux-xclip"'

# Catppuccin settings
set -g @catppuccin_flavor 'frappe' # Options: latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"

%hidden MODULE_NAME="mem_cpu"

# This requires https://github.com/thewtex/tmux-mem-cpu-load
set -g "@catppuccin_mem_cpu_icon" " "
set -gF "@catppuccin_mem_cpu_color" "#{E:@thm_pink}"
set -g "@catppuccin_mem_cpu_text" " #(~/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load --cpu-mode 2 --averages-count 0 --interval 2) "

source "~/.tmux/plugins/tmux/utils/status_module.conf"

set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#[bg=#{@thm_lavender},fg=#{@thm_crust}]#[reverse]#[noreverse]🎟 #[fg=#{@thm_lavender},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load --cpu-mode 2 --averages-count 0 --graph-lines 0 --interval 2 | awk '{print $1}') "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{@catppuccin_status_gitmux}"

# Plugin manager and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# Initialize TPM (must be last)
run -b '~/.tmux/plugins/tpm/tpm'
